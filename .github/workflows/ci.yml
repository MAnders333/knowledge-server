name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Type-check & test
    runs-on: ubuntu-latest

    services:
      postgres:
        # Ephemeral CI-only instance — credentials are not secret.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ks
          POSTGRES_PASSWORD: ks
          POSTGRES_DB: knowledge
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Keep in sync with the Bun version in release-please.yml (binaries are built with it).
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Type-check
        run: bun run typecheck

      - name: Test
        run: bun test
        env:
          PG_TEST_URI: postgres://ks:ks@localhost:5432/knowledge

      - name: Dependency audit (non-blocking)
        continue-on-error: true
        run: bun audit

      - name: Compile smoke test
        if: ${{ github.event_name == 'pull_request' }}
        env:
          # Binary size budgets (bytes) for linux-x64 built with Bun 1.3.9.
          # Measured 2026-11-12: server 127452896, daemon 102051666. Budget = measured + 10%.
          # Raise deliberately, with the new measurement in this comment, when a
          # dependency change legitimately grows the binary.
          SERVER_SIZE_BUDGET: 140198185
          DAEMON_SIZE_BUDGET: 112256832
        run: |
          bun build --compile --minify src/index.ts --outfile dist/knowledge-server-linux-x64
          bun build --compile --minify src/daemon/index.ts --outfile dist/knowledge-daemon-linux-x64
          ./dist/knowledge-server-linux-x64 --help > /dev/null
          ./dist/knowledge-daemon-linux-x64 --version > /dev/null

          check_size() {
            local file="$1" budget="$2" size
            size="$(stat -c %s "$file")"
            if [ "$size" -gt "$budget" ]; then
              echo "::error::$file is $size bytes, over the $budget-byte budget"
              return 1
            fi
            echo "$file: $size bytes (budget $budget)"
          }
          status=0
          check_size dist/knowledge-server-linux-x64 "$SERVER_SIZE_BUDGET" || status=1
          check_size dist/knowledge-daemon-linux-x64 "$DAEMON_SIZE_BUDGET" || status=1
          exit "$status"
