name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Type-check & test
    runs-on: ubuntu-latest

    services:
      postgres:
        # Ephemeral CI-only instance — credentials are not secret.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ks
          POSTGRES_PASSWORD: ks
          POSTGRES_DB: knowledge
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # Keep in sync with the Bun version in release-please.yml (binaries are built with it).
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Type-check
        run: bun run typecheck

      - name: Test
        run: bun test
        env:
          PG_TEST_URI: postgres://ks:ks@localhost:5432/knowledge

      - name: Dependency audit (non-blocking)
        continue-on-error: true
        run: bun audit

      - name: Compile smoke test
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          bun build --compile --minify src/index.ts --outfile dist/knowledge-server-linux-x64
          bun build --compile --minify src/daemon/index.ts --outfile dist/knowledge-daemon-linux-x64
          ./dist/knowledge-server-linux-x64 --help > /dev/null
