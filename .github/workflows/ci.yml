name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Type-check & test
    runs-on: ubuntu-latest

    services:
      postgres:
        # Ephemeral CI-only instance — credentials are not secret.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ks
          POSTGRES_PASSWORD: ks
          POSTGRES_DB: knowledge
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Single source of truth for the Bun version (also used by release-please.yml
          # and scripts/check-bun-advisories.ts).
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Type-check
        run: bun run typecheck

      - name: Test
        run: bun test
        env:
          PG_TEST_URI: postgres://ks:ks@localhost:5432/knowledge

      - name: Dependency audit (non-blocking)
        continue-on-error: true
        run: bun audit

      - name: Pinned Bun has no published security advisories
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/check-bun-advisories.ts

      - name: Compile smoke test
        if: ${{ github.event_name == 'pull_request' }}
        env:
          # Binary size budgets (bytes) for linux-x64 built with the Bun version in .bun-version and the
          # same compile flags as the `compile` script in package.json. Measured 2026-11-12 with
          #   bun run compile --target=bun-linux-x64 <entry> --outfile <out>   (bun 1.4.4)
          # server 123754672 bytes, daemon 109287600 bytes. Budget = measured + 10%.
          # To re-baseline: re-measure with that command, set each budget to the new
          # size * 1.1 and update the numbers in this comment. Raise a budget only
          # when a dependency change legitimately grows the binary.
          SERVER_SIZE_BUDGET: 136130139
          DAEMON_SIZE_BUDGET: 120216360
        run: |
          bun run compile src/index.ts --outfile dist/knowledge-server-linux-x64
          bun run compile src/daemon/index.ts --outfile dist/knowledge-daemon-linux-x64
          ./dist/knowledge-server-linux-x64 --help > /dev/null
          ./dist/knowledge-daemon-linux-x64 --version > /dev/null

          check_size() {
            local file="$1" budget="$2" size
            size="$(stat -c %s "$file")"
            if [ "$size" -gt "$budget" ]; then
              echo "::error::$file is $size bytes, over the $budget-byte budget"
              return 1
            fi
            echo "$file: $size bytes (budget $budget)"
          }
          status=0
          check_size dist/knowledge-server-linux-x64 "$SERVER_SIZE_BUDGET" || status=1
          check_size dist/knowledge-daemon-linux-x64 "$DAEMON_SIZE_BUDGET" || status=1
          exit "$status"
