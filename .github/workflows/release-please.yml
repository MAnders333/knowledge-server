name: Release Please

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# No default token scope. Each job grants only what it needs below.
permissions: {}

jobs:
  release-please:
    # One release run at a time. cancel-in-progress is false, so a run in progress is
    # never cancelled. The group is on this job, not the workflow: the job-level `if`
    # below is evaluated before the group is entered, so skipped runs (PRs, forks,
    # failed CI) never take the group's pending slot and cancel a pending release.
    concurrency:
      group: release-please
      cancel-in-progress: false
    # Only for CI runs of a direct push to this repository (not PR runs, not forks).
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Confirm the CI-validated commit is still main's head
        id: head
        # workflow_run.head_sha is the commit CI validated. If main has moved on,
        # skip this run: the CI run for the newer commit triggers its own release.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          if [ "$current" = "$VALIDATED_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::main is at $current, not the validated $VALIDATED_SHA; skipping this release run."
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi
      # release-please reads release-please-config.json (draft: true, so this creates
      # a draft release with its tag, via force-tag-creation) and
      # .release-please-manifest.json. Do not pass release-type here: with that input
      # the action ignores the config file. Nothing is installable until the publish
      # job below promotes the draft.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        if: ${{ steps.head.outputs.current == 'true' }}
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  build-binaries:
    name: Build binaries (${{ matrix.suffix }})
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: read
      # Required by actions/attest-build-provenance (Sigstore OIDC identity).
      id-token: write
      attestations: write
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            suffix: linux-x64
          - os: macos-latest
            suffix: darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Build the commit release-please tagged, not whatever main points at now.
          ref: ${{ needs.release-please.outputs.sha }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Pin Bun for reproducible binaries; the version lives in .bun-version
          # (shared with ci.yml). The pin must not be affected by a published Bun
          # advisory (scripts/check-bun-advisories.ts runs in CI). History: an
          # older Bun release produced darwin-arm64 artifacts that failed macOS
          # exec/signature validation on some machines (SIGKILL before process
          # startup); the codesign + smoke steps below guard against a repeat.
          bun-version-file: .bun-version

      - name: Install production dependencies
        # The shipped binaries bundle only runtime dependencies (no src/ file
        # imports a devDependency). Skip devDependencies and lifecycle scripts.
        run: bun install --frozen-lockfile --production --ignore-scripts

      - name: Build binaries
        run: |
          bun run compile src/index.ts --outfile dist/knowledge-server-${{ matrix.suffix }}
          bun run compile src/daemon/index.ts --outfile dist/knowledge-daemon-${{ matrix.suffix }}

      - name: Re-sign macOS binaries (ad-hoc)
        if: ${{ matrix.suffix == 'darwin-arm64' }}
        run: |
          # Bun-compiled Mach-O artifacts can carry invalid embedded signature
          # metadata depending on toolchain/runtime combination. Re-signing with
          # an ad-hoc identity makes the binary structurally valid for macOS
          # verification/execution and avoids publishing unusable artifacts.
          codesign --force --sign - dist/knowledge-server-${{ matrix.suffix }}
          codesign --force --sign - dist/knowledge-daemon-${{ matrix.suffix }}
          codesign --verify --verbose dist/knowledge-server-${{ matrix.suffix }}
          codesign --verify --verbose dist/knowledge-daemon-${{ matrix.suffix }}

      - name: Smoke test binaries
        # Side-effect-free entry points only: both exit 0 before touching any
        # database or network. This catches pre-runtime SIGKILL failures too.
        run: |
          ./dist/knowledge-server-${{ matrix.suffix }} --help > /dev/null
          ./dist/knowledge-daemon-${{ matrix.suffix }} --version > /dev/null

      - name: Assemble release files
        run: |
          cp plugin/knowledge.ts dist/knowledge.ts
          cp plugin/pi-knowledge.ts dist/pi-knowledge.ts
          cp plugin/omp-knowledge.ts dist/omp-knowledge.ts
          cp commands/consolidate.md dist/consolidate.md
          cp commands/knowledge-review.md dist/knowledge-review.md
          cp scripts/install.sh dist/install.sh
          cd dist
          for bin in knowledge-server-${{ matrix.suffix }} knowledge-daemon-${{ matrix.suffix }}; do
            gzip -c "$bin" > "$bin.gz"
          done

      - name: Generate SHA256SUMS
        # One manifest per platform. It covers the binaries and every
        # platform-independent file that install.sh, update and setup-tool
        # download (install.sh included, so a downloaded copy can be checked
        # against the same manifest), so none of them can be fetched unverified.
        run: |
          cd dist
          files=(
            knowledge-server-${{ matrix.suffix }}
            knowledge-daemon-${{ matrix.suffix }}
            knowledge.ts
            pi-knowledge.ts
            omp-knowledge.ts
            consolidate.md
            knowledge-review.md
            install.sh
          )
          if command -v sha256sum &>/dev/null; then
            sha256sum "${files[@]}" > SHA256SUMS-${{ matrix.suffix }}
          else
            shasum -a 256 "${files[@]}" > SHA256SUMS-${{ matrix.suffix }}
          fi
          cat SHA256SUMS-${{ matrix.suffix }}

      - name: Attest binaries and checksums
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/knowledge-server-${{ matrix.suffix }}
            dist/knowledge-daemon-${{ matrix.suffix }}
            dist/SHA256SUMS-${{ matrix.suffix }}

      - name: Attest installer
        if: ${{ matrix.suffix == 'linux-x64' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/install.sh

      - name: Stage release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.suffix }}
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/knowledge-server-${{ matrix.suffix }}
            dist/knowledge-server-${{ matrix.suffix }}.gz
            dist/knowledge-daemon-${{ matrix.suffix }}
            dist/knowledge-daemon-${{ matrix.suffix }}.gz
            dist/SHA256SUMS-${{ matrix.suffix }}
            dist/knowledge.ts
            dist/pi-knowledge.ts
            dist/omp-knowledge.ts
            dist/consolidate.md
            dist/knowledge-review.md
            dist/install.sh

  publish:
    # Runs only when every build leg succeeded. Until this job promotes the
    # draft, /releases/latest (used by install.sh and update) does not see it.
    # If a build leg fails, re-run only the failed jobs within 7 days, while the
    # staged artifacts still exist (retention-days below). A full re-run does not
    # recover the draft: release-please has already tagged the release, so the
    # release-please job reports no new release and this job is skipped. Once the
    # artifacts expire, upload the missing assets with `gh release upload` and
    # promote the draft with `gh release edit --draft=false` by hand.
    name: Publish release
    needs: [release-please, build-binaries]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - name: Download staged files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: artifacts

      - name: Upload assets to the draft release
        run: |
          cd artifacts
          # --clobber: a re-run after a partial upload replaces the draft's assets
          # with this run's identical builds instead of failing on "already exists".
          gh release upload "$TAG" --clobber \
            release-linux-x64/knowledge-server-linux-x64 \
            release-linux-x64/knowledge-server-linux-x64.gz \
            release-linux-x64/knowledge-daemon-linux-x64 \
            release-linux-x64/knowledge-daemon-linux-x64.gz \
            release-linux-x64/SHA256SUMS-linux-x64 \
            release-darwin-arm64/knowledge-server-darwin-arm64 \
            release-darwin-arm64/knowledge-server-darwin-arm64.gz \
            release-darwin-arm64/knowledge-daemon-darwin-arm64 \
            release-darwin-arm64/knowledge-daemon-darwin-arm64.gz \
            release-darwin-arm64/SHA256SUMS-darwin-arm64 \
            release-linux-x64/knowledge.ts \
            release-linux-x64/pi-knowledge.ts \
            release-linux-x64/omp-knowledge.ts \
            release-linux-x64/consolidate.md \
            release-linux-x64/knowledge-review.md \
            release-linux-x64/install.sh

      - name: Verify every expected asset is present
        run: |
          expected="knowledge-server-linux-x64 knowledge-server-linux-x64.gz knowledge-daemon-linux-x64 knowledge-daemon-linux-x64.gz SHA256SUMS-linux-x64 knowledge-server-darwin-arm64 knowledge-server-darwin-arm64.gz knowledge-daemon-darwin-arm64 knowledge-daemon-darwin-arm64.gz SHA256SUMS-darwin-arm64 knowledge.ts pi-knowledge.ts omp-knowledge.ts consolidate.md knowledge-review.md install.sh"
          present="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          missing=0
          for name in $expected; do
            if ! grep -qxF "$name" <<< "$present"; then
              echo "::error::missing release asset: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Publish release
        run: gh release edit "$TAG" --draft=false
